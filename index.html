<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hockey Live Scoring</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #d1d5db;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .section-title {
      margin-top: 30px;
      margin-bottom: 15px;
      font-size: 22px;
      border-left: 5px solid #111827;
      padding-left: 10px;
    }

    .live-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .match-status {
      display: inline-block;
      background: #dc2626;
      color: white;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .status-upcoming {
      background: #2563eb;
    }

    .status-finished {
      background: #16a34a;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .team {
      width: 40%;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    .score {
      width: 20%;
      text-align: center;
      font-size: 36px;
      font-weight: bold;
    }

    .info {
      margin-top: 15px;
      text-align: center;
      color: #555;
      font-size: 14px;
    }

    .updated {
      margin-top: 10px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #111827;
      color: white;
    }

    .empty {
      text-align: center;
      color: #777;
    }

    .admin-link {
      text-align: center;
      margin-top: 30px;
    }

    .admin-link a {
      color: #111827;
      font-weight: bold;
      text-decoration: none;
    }

    .admin-link a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 30px;
      color: #666;
    }

    @media (max-width: 600px) {
      .score-row {
        flex-direction: column;
      }

      .team, .score {
        width: 100%;
      }

      .score {
        font-size: 32px;
      }

      th, td {
        font-size: 13px;
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Hockey Live Scoring</h1>
    <p>2-Day Hockey Tournament | 96 Teams</p>
  </header>

  <div class="container">

    <h2 class="section-title">Live Match</h2>

    <div class="live-card">
      <div id="status" class="match-status">LOADING</div>

      <div class="score-row">
        <div id="teamA" class="team">Team A</div>
        <div id="score" class="score">0 - 0</div>
        <div id="teamB" class="team">Team B</div>
      </div>

      <div id="matchInfo" class="info">
        Category: - | Field: - | Match: -
      </div>

      <div id="updatedAt" class="updated">
        Updating live score...
      </div>
    </div>

    <h2 class="section-title">Top Scorer</h2>

    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>Team</th>
          <th>Goals</th>
        </tr>
      </thead>
      <tbody id="scorerTable">
        <tr>
          <td colspan="4" class="empty">Loading top scorer...</td>
        </tr>
      </tbody>
    </table>

    <div class="admin-link">
      <a href="admin.html">Admin Login</a>
    </div>

  </div>

  <footer>
    Hockey Live Scoring Website
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://ylmmkgcxfncocxlilgrj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_GSmYzJ436-VGzg8AH4eUKg_z44OYF3c";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadLiveMatch() {
      const { data, error } = await supabaseClient
        .from("live_match")
        .select("*")
        .eq("id", 1)
        .single();

      if (error) {
        console.log(error);
        document.getElementById("status").textContent = "ERROR";
        document.getElementById("updatedAt").textContent = "Unable to load live score.";
        return;
      }

      if (data) {
        const statusElement = document.getElementById("status");

        statusElement.textContent = data.status || "LIVE";
        statusElement.className = "match-status";

        if (data.status === "UPCOMING") {
          statusElement.classList.add("status-upcoming");
        }

        if (data.status === "FINISHED") {
          statusElement.classList.add("status-finished");
        }

        document.getElementById("teamA").textContent = data.team_a || "Team A";
        document.getElementById("teamB").textContent = data.team_b || "Team B";
        document.getElementById("score").textContent =
          (data.score_a ?? 0) + " - " + (data.score_b ?? 0);

        document.getElementById("matchInfo").textContent =
          "Category: " + (data.category || "-") +
          " | " + (data.field_name || "-") +
          " | " + (data.match_number || "-");

        if (data.updated_at) {
          const updateTime = new Date(data.updated_at).toLocaleString();
          document.getElementById("updatedAt").textContent =
            "Last updated: " + updateTime;
        }
      }
    }

    async function loadTopScorers() {
      const { data, error } = await supabaseClient
        .from("top_scorers")
        .select("*")
        .order("goals", { ascending: false });

      const scorerTable = document.getElementById("scorerTable");

      if (error) {
        console.log(error);
        scorerTable.innerHTML = `
          <tr>
            <td colspan="4" class="empty">Unable to load top scorer.</td>
          </tr>
        `;
        return;
      }

      scorerTable.innerHTML = "";

      if (!data || data.length === 0) {
        scorerTable.innerHTML = `
          <tr>
            <td colspan="4" class="empty">No scorer yet.</td>
          </tr>
        `;
        return;
      }

      data.forEach(function(player, index) {
        const row = `
          <tr>
            <td>${index + 1}</td>
            <td>${player.player_name}</td>
            <td>${player.team_name}</td>
            <td>${player.goals}</td>
          </tr>
        `;

        scorerTable.innerHTML += row;
      });
    }

    function loadAllData() {
      loadLiveMatch();
      loadTopScorers();
    }

    loadAllData();

    setInterval(loadAllData, 3000);
  </script>

</body>
</html>
