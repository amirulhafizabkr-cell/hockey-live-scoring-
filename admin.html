<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Hockey Live Scoring</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      border-left: 5px solid #111827;
      padding-left: 10px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 12px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #374151;
    }

    .score-box {
      display: flex;
      gap: 15px;
    }

    .score-box div {
      flex: 1;
    }

    .success {
      margin-top: 15px;
      padding: 10px;
      background: #dcfce7;
      color: #166534;
      border-radius: 8px;
      display: none;
    }

    .error {
      margin-top: 15px;
      padding: 10px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      display: none;
    }

    .link {
      text-align: center;
      margin-top: 20px;
    }

    .link a {
      color: #111827;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>Admin Panel</h1>
    <p>Hockey Live Scoring Editor</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>Login</h2>

      <label>Admin Password</label>
      <input type="password" id="password" placeholder="Enter admin password">

      <button onclick="login()">Login</button>

      <div id="loginMessage" class="success">Login successful.</div>
      <div id="loginError" class="error">Wrong password.</div>
    </div>

    <div id="adminArea" style="display:none;">

      <div class="card">
        <h2>Update Live Match</h2>

        <label>Match Number</label>
        <input type="text" id="matchNumber" value="Match 1">

        <label>Category</label>
        <input type="text" id="category" value="Under 10 Boys">

        <label>Field</label>
        <input type="text" id="field" value="Field 1">

        <label>Team A</label>
        <input type="text" id="teamA" value="Team A">

        <label>Team B</label>
        <input type="text" id="teamB" value="Team B">

        <div class="score-box">
          <div>
            <label>Team A Score</label>
            <input type="number" id="scoreA" value="0">
          </div>

          <div>
            <label>Team B Score</label>
            <input type="number" id="scoreB" value="0">
          </div>
        </div>

        <label>Status</label>
        <select id="status">
          <option>LIVE</option>
          <option>UPCOMING</option>
          <option>FINISHED</option>
        </select>

        <button onclick="saveMatch()">Save Match</button>

        <div id="saveMessage" class="success">Match saved successfully.</div>
        <div id="saveError" class="error">Error saving match.</div>
      </div>

      <div class="card">
        <h2>Add Goal Scorer</h2>

        <label>Player Name</label>
        <input type="text" id="playerName" placeholder="Example: Ali Hakim">

        <label>Team Name</label>
        <input type="text" id="playerTeam" placeholder="Example: Team A">

        <label>Goals</label>
        <input type="number" id="playerGoals" value="1">

        <button onclick="addScorer()">Add Scorer</button>

        <div id="scorerMessage" class="success">Scorer added successfully.</div>
        <div id="scorerError" class="error">Error adding scorer.</div>
      </div>

    </div>

    <div class="link">
      <a href="index.html">Back to Public Website</a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://ylmmkgcxfncocxlilgrj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_GSmYzJ436-VGzg8AH4eUKg_z44OYF3c";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const ADMIN_PASSWORD = "amirulhensem";

    function login() {
      const password = document.getElementById("password").value;

      if (password === ADMIN_PASSWORD) {
        document.getElementById("adminArea").style.display = "block";
        document.getElementById("loginMessage").style.display = "block";
        document.getElementById("loginError").style.display = "none";
        loadCurrentMatch();
      } else {
        document.getElementById("loginError").style.display = "block";
        document.getElementById("loginMessage").style.display = "none";
      }
    }

    async function loadCurrentMatch() {
      const { data, error } = await supabaseClient
        .from("live_match")
        .select("*")
        .eq("id", 1)
        .single();

      if (error) {
        console.log(error);
        return;
      }

      if (data) {
        document.getElementById("matchNumber").value = data.match_number || "Match 1";
        document.getElementById("category").value = data.category || "Under 10 Boys";
        document.getElementById("field").value = data.field_name || "Field 1";
        document.getElementById("teamA").value = data.team_a || "Team A";
        document.getElementById("teamB").value = data.team_b || "Team B";
        document.getElementById("scoreA").value = data.score_a || 0;
        document.getElementById("scoreB").value = data.score_b || 0;
        document.getElementById("status").value = data.status || "LIVE";
      }
    }

    async function saveMatch() {
      document.getElementById("saveMessage").style.display = "none";
      document.getElementById("saveError").style.display = "none";

      const matchData = {
        id: 1,
        match_number: document.getElementById("matchNumber").value,
        category: document.getElementById("category").value,
        field_name: document.getElementById("field").value,
        team_a: document.getElementById("teamA").value,
        team_b: document.getElementById("teamB").value,
        score_a: Number(document.getElementById("scoreA").value),
        score_b: Number(document.getElementById("scoreB").value),
        status: document.getElementById("status").value,
        updated_at: new Date().toISOString()
      };

      const { error } = await supabaseClient
        .from("live_match")
        .upsert(matchData);

      if (error) {
        console.log(error);
        document.getElementById("saveError").style.display = "block";
      } else {
        document.getElementById("saveMessage").style.display = "block";
      }
    }

    async function addScorer() {
      document.getElementById("scorerMessage").style.display = "none";
      document.getElementById("scorerError").style.display = "none";

      const playerName = document.getElementById("playerName").value.trim();
      const teamName = document.getElementById("playerTeam").value.trim();
      const goals = Number(document.getElementById("playerGoals").value);

      if (playerName === "" || teamName === "") {
        alert("Please enter player name and team name");
        return;
      }

      const { data: existingPlayer, error: findError } = await supabaseClient
        .from("top_scorers")
        .select("*")
        .eq("player_name", playerName)
        .eq("team_name", teamName)
        .maybeSingle();

      if (findError) {
        console.log(findError);
        document.getElementById("scorerError").style.display = "block";
        return;
      }

      if (existingPlayer) {
        const newGoals = Number(existingPlayer.goals) + goals;

        const { error: updateError } = await supabaseClient
          .from("top_scorers")
          .update({ goals: newGoals })
          .eq("id", existingPlayer.id);

        if (updateError) {
          console.log(updateError);
          document.getElementById("scorerError").style.display = "block";
          return;
        }
      } else {
        const { error: insertError } = await supabaseClient
          .from("top_scorers")
          .insert({
            player_name: playerName,
            team_name: teamName,
            goals: goals
          });

        if (insertError) {
          console.log(insertError);
          document.getElementById("scorerError").style.display = "block";
          return;
        }
      }

      document.getElementById("scorerMessage").style.display = "block";

      document.getElementById("playerName").value = "";
      document.getElementById("playerTeam").value = "";
      document.getElementById("playerGoals").value = 1;
    }
  </script>

</body>
</html>
